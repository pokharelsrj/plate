name: Pi
options:
  bundleIdPrefix: com.srijanpokharel
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set DEVELOPMENT_TEAM once (Xcode > Signing, or a local .xcconfig) and
    # every target picks it up.
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
targets:
  Pi:
    type: application
    platform: iOS
    sources:
      - Pi
      - Shared
    dependencies:
      - target: PiWidget
        embed: true
      - target: PiWatch
        embed: true
    info:
      path: Pi/Info.plist
      properties:
        CFBundleDisplayName: Plate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Reads steps, sleep, active energy, and resting heart rate so Plate can log them alongside your workouts and meals.
        NSHealthUpdateUsageDescription: Plate does not write health data.
        NSFaceIDUsageDescription: Face ID unlocks the app when the lock is enabled in Settings.
        NSSupportsLiveActivities: true
        # Only HTTPS via URLSession and the system Keychain — both exempt, so
        # App Store Connect stops asking on every upload.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.srijanpokharel.pi.health.fullsync
          - com.srijanpokharel.pi.health.hourly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srijanpokharel.pi
        PRODUCT_NAME: Pi
        CODE_SIGN_ENTITLEMENTS: Pi/Pi.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: PiPrimary
  PiWatch:
    type: application
    platform: watchOS
    sources:
      - PiWatch
      - Pi/Models/Models.swift
    info:
      path: PiWatch/Info.plist
      properties:
        CFBundleDisplayName: Plate
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.srijanpokharel.pi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srijanpokharel.pi.watchkitapp
        PRODUCT_NAME: Pi
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PiWidget:
    type: app-extension
    platform: iOS
    sources:
      - PiWidget
      - Shared
      - Pi/Models/Models.swift
      - Pi/Assets.xcassets
    info:
      path: PiWidget/Info.plist
      properties:
        CFBundleDisplayName: Plate Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srijanpokharel.pi.PiWidget
        CODE_SIGN_ENTITLEMENTS: PiWidget/PiWidget.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

# A shared scheme, so `xcodebuild -scheme Plate` works from the command line
# and CI, and everyone opening the project gets the same one. Without it Xcode
# invents per-user schemes that never get committed.
schemes:
  Plate:
    build:
      targets:
        Pi: all
    run:
      config: Debug
    archive:
      config: Release
