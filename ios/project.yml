name: Pi
options:
  bundleIdPrefix: com.srijanpokharel
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pi:
    type: application
    platform: iOS
    sources:
      - Pi
      - Shared
    dependencies:
      - target: PiWidget
        embed: true
      - target: PiWatch
        embed: true
    info:
      path: Pi/Info.plist
      properties:
        CFBundleDisplayName: Pi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Reads steps, sleep, active energy, and resting heart rate to log them to your Pi.
        NSHealthUpdateUsageDescription: Pi does not write health data.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: Face ID unlocks the app when the lock is enabled in Settings.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srijanpokharel.pi
        PRODUCT_NAME: Pi
        CODE_SIGN_ENTITLEMENTS: Pi/Pi.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: PiPrimary
  PiWatch:
    type: application
    platform: watchOS
    sources:
      - PiWatch
      - Pi/Models/Models.swift
    info:
      path: PiWatch/Info.plist
      properties:
        CFBundleDisplayName: Pi
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.srijanpokharel.pi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srijanpokharel.pi.watchkitapp
        PRODUCT_NAME: Pi
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  PiWidget:
    type: app-extension
    platform: iOS
    sources:
      - PiWidget
      - Shared
      - Pi/Models/Models.swift
      - Pi/Assets.xcassets
    info:
      path: PiWidget/Info.plist
      properties:
        CFBundleDisplayName: Pi Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srijanpokharel.pi.PiWidget
        CODE_SIGN_ENTITLEMENTS: PiWidget/PiWidget.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
